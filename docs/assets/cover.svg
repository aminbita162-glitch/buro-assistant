<svg xmlns="http://www.w3.org/2000/svg" width="780" height="200" viewBox="0 0 780 200">
  <!-- Background -->
  <rect width="780" height="200" rx="10" ry="10" fill="#0f172a"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="200" rx="3" ry="3" fill="#3b82f6"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="40"  x2="780" y2="40"  stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="80"  x2="780" y2="80"  stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="120" x2="780" y2="120" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="160" x2="780" y2="160" stroke="#1e293b" stroke-width="1"/>
  <line x1="156" y1="0" x2="156" y2="200" stroke="#1e293b" stroke-width="1"/>
  <line x1="312" y1="0" x2="312" y2="200" stroke="#1e293b" stroke-width="1"/>
  <line x1="468" y1="0" x2="468" y2="200" stroke="#1e293b" stroke-width="1"/>
  <line x1="624" y1="0" x2="624" y2="200" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo text -->
  <text x="36" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="700" fill="#f8fafc" letter-spacing="-1">Buro</text>
  <text x="36" y="108" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.5">Assistant</text>

  <!-- Divider -->
  <line x1="36" y1="120" x2="380" y2="120" stroke="#334155" stroke-width="1"/>

  <!-- Tagline -->
  <text x="36" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Self-hosted · Multi-tenant · Rules before model</text>

  <!-- Right: three status pills -->
  <!-- Pill 1: Rule Engine -->
  <rect x="460" y="60" width="140" height="32" rx="6" ry="6" fill="#172554"/>
  <circle cx="480" cy="76" r="5" fill="#3b82f6"/>
  <text x="492" y="81" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#bfdbfe">Rule Engine</text>

  <!-- Pill 2: Shadow Mode -->
  <rect x="460" y="100" width="140" height="32" rx="6" ry="6" fill="#1e1b4b"/>
  <circle cx="480" cy="116" r="5" fill="#818cf8"/>
  <text x="492" y="121" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#c7d2fe">Shadow Mode</text>

  <!-- Pill 3: Audit Chain -->
  <rect x="460" y="140" width="140" height="32" rx="6" ry="6" fill="#052e16"/>
  <circle cx="480" cy="156" r="5" fill="#22c55e"/>
  <text x="492" y="161" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#bbf7d0">Audit Chain</text>

  <!-- Far right: agent column -->
  <!-- Amin -->
  <rect x="620" y="60" width="130" height="32" rx="6" ry="6" fill="#1c1917"/>
  <text x="636" y="81" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#a8a29e">&#x2022; Amin  triage</text>

  <!-- Amilos -->
  <rect x="620" y="100" width="130" height="32" rx="6" ry="6" fill="#1c1917"/>
  <text x="636" y="121" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#a8a29e">&#x2022; Amilos  reply</text>

  <!-- Leila -->
  <rect x="620" y="140" width="130" height="32" rx="6" ry="6" fill="#1c1917"/>
  <text x="636" y="161" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#a8a29e">&#x2022; Leila  supervisor</text>

  <!-- Bottom author -->
  <text x="36" y="185" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#475569">Amin Azimi · Azimi Innovation Lab</text>
</svg>
